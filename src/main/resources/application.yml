spring:
  application:
    name: url-shortener
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shortener}
    username: ${DB_USERNAME:shortener}
    password: ${DB_PASSWORD:shortener}
    hikari:
      connection-timeout: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  shutdown: graceful

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"

shortener:
  base-url: ${BASE_URL:http://localhost:8080}
  code-length: 8
  collision-retries: 5
  default-ttl: 365d

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus